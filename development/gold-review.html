<!doctype html><html lang="es"><meta charset="utf-8"><title>PAESSED — revisión de contenido</title><link rel="stylesheet" href="../viewer/vendor/katex/dist/katex.min.css"><link rel="stylesheet" href="../viewer/block-renderer.css"><style>body{font:16px system-ui;margin:2rem;max-width:1000px}article{border-bottom:1px solid #aaa;padding:1.5rem 0}.option{display:flex;gap:1rem;margin:.5rem 0}.question-meta{color:#555;font-size:.85rem}</style><h1>Revisión de contenido</h1><p>Esta vista facilita revisar el paquete. No acredita cotejo con el PDF ni certificación Gold.</p><input type="file" id="file" accept=".paessed,.zip"><p id="status" role="status"></p><main id="questions"></main><script src="../viewer/vendor/jszip/dist/jszip.min.js"></script><script src="../viewer/validator.js"></script><script src="../viewer/package-reader.js"></script><script src="../viewer/vendor/katex/dist/katex.min.js"></script><script src="../viewer/block-renderer.js"></script><script>
let urls=new Map(),operation=0;function release(){urls.forEach(url=>URL.revokeObjectURL(url));urls=new Map();}window.addEventListener('beforeunload',release);
document.getElementById('file').addEventListener('change',async event=>{const token=++operation;release();const main=document.getElementById('questions');main.replaceChildren();const status=document.getElementById('status');try{const pkg=await PaessedPackage.readPackage(event.target.files[0],{cancelled:()=>token!==operation});pkg.blobs.forEach((blob,id)=>urls.set(id,URL.createObjectURL(blob)));for(const q of pkg.data.questions){const article=document.createElement('article'),heading=document.createElement('h2'),meta=document.createElement('p');heading.textContent='Pregunta '+q.number;meta.className='question-meta';meta.textContent=q.id+' · Regiones: '+JSON.stringify(q.regions)+' · Currículo: '+JSON.stringify(q.curriculum??'Ausente en histórico');article.append(heading,meta);const stem=document.createElement('div');stem.className='paessed-blocks';PaessedBlocks.renderBlocks(stem,q.stem,{katex,assetUrls:urls});article.append(stem);for(const option of q.options){const row=document.createElement('div'),label=document.createElement('strong'),blocks=document.createElement('div');row.className='option';label.textContent=option.label;PaessedBlocks.renderBlocks(blocks,option.blocks,{katex,assetUrls:urls});row.append(label,blocks);article.append(row);}const answer=document.createElement('p');answer.textContent='Respuesta: '+(q.answer.label??'pendiente')+' ('+q.answer.status+') · Fidelidad: '+q.fidelity.status;article.append(answer);const exp=document.createElement('div');PaessedBlocks.renderBlocks(exp,q.explanation.blocks,{katex,assetUrls:urls});article.append(exp);main.append(article);}status.textContent=pkg.data.questions.length+' preguntas. '+(pkg.validation.warnings||[]).join(' ');}catch(error){if(token===operation)status.textContent=error.message;}});
</script></html>
